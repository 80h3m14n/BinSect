# TO be implemented: Continuous Integration (CI/CD) pipelines via Github actions for automated testing and deployment
name: Build and Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: sudo apt-get install -y build-essential valgrind
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Memory check
        run: valgrind --leak-check=full ./binsect /bin/ls
